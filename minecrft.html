<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINECRAFT CURIOSIDADES</title>
    <link rel="stylesheet" href="micraft.css">
    
    
</head>
<body>

    <h1>REGISTRO DE CURIOSIDADES MINECRAFT</h1>

    <form onsubmit="window.location.href='mini.html'; return false;">
        
      <label for="nombre">NOMBRE:</label>
      <input type="text" id="nombre" name="NOMBRE" required>
      
      <label for="correo">CORREO:</label>
      <input type="email" id="correo" name="CORREO" required>
      
      
      <label for="contraseña">CONTRASEÑA:</label>
      <input type="password" id="contraseña" name="CORREO" required>
          
      
      <label for="direccion">DIRECCIÓN:</label>
      <input type="text" id="direccion" name="DIRECCION" required>
      <button type="submit">Terminar Registro</button>
        
    </form>

</body>
</html>
